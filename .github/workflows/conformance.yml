name: Conformance

# The single quality gate for this repository. It is a reusable workflow so that CI and
# the release pipeline call the *same* checks: nothing can be published that has not
# passed exactly what a pull request has to pass. If you add a check, add it here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  suite:
    name: Vector suite and version surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every vector the manifests name exists, every vector on disk is named, every
      # failure code is registered, and one version string spans SPEC, CONFORMANCE,
      # CITATION and both manifests.
      - run: python scripts/check_suite.py

  npm:
    name: npm client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/npm/package-lock.json
      - run: npm ci
      - run: npm test

  python:
    name: Python client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and the current release, so a
        # 3.9-incompatible construct cannot reach PyPI under a >=3.9 promise.
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - run: pytest -q

  rust:
    name: Rust client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # A single job for branch protection to require, so adding a check above does not
  # mean re-configuring the protected-branch rule.
  gate:
    name: Conformance gate
    runs-on: ubuntu-latest
    needs: [suite, npm, python, rust]
    if: always()
    steps:
      - name: Fail if any check did not succeed
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "upstream results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a conformance check did not succeed; refusing to pass the gate"
              exit 1
            fi
          done
