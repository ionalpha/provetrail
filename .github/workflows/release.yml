name: Release

# Publishing is version-driven, not tag-driven: merge a manifest version bump to main
# and the matching package publishes itself, provided the conformance gate is green.
# A push whose versions are all already on the registries publishes nothing, so ordinary
# merges are silent. Registries reject a duplicate version, and this checks first
# anyway, so a re-run cannot overwrite a release.
#
# Every package is built and published from CI, never a laptop, so each carries
# provenance linking the artifact to this repository, commit and workflow run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two releases race; never cancel one in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same checks a pull request has to pass. Publishing depends on this job, so a
  # red gate means nothing ships.
  gate:
    uses: ./.github/workflows/conformance.yml

  plan:
    name: Decide what needs publishing
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.check.outputs.npm }}
      npm_version: ${{ steps.check.outputs.npm_version }}
      pypi: ${{ steps.check.outputs.pypi }}
      pypi_version: ${{ steps.check.outputs.pypi_version }}
      crate: ${{ steps.check.outputs.crate }}
      crate_version: ${{ steps.check.outputs.crate_version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Compare manifest versions against the registries
        run: |
          set -euo pipefail

          npm_version=$(jq -r .version clients/npm/package.json)
          pypi_version=$(grep -m1 '^version = ' clients/python/pyproject.toml | cut -d'"' -f2)
          crate_version=$(grep -m1 '^version = ' clients/rust/Cargo.toml | cut -d'"' -f2)

          # An unpublished version is one the registry does not already serve. Treat a
          # registry error as "already published" so a transient outage cannot cause an
          # accidental publish.
          published=$(npm view provetrail versions --json 2>/dev/null || echo '[]')
          if echo "$published" | jq -e --arg v "$npm_version" 'index($v) != null' >/dev/null; then
            npm=false
          else
            npm=true
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/provetrail/$pypi_version/json" || echo 200)
          [ "$code" = "404" ] && pypi=true || pypi=false

          code=$(curl -sS -o /dev/null -w '%{http_code}' -A 'provetrail-release-ci (github.com/ionalpha/provetrail)' \
            "https://crates.io/api/v1/crates/provetrail/$crate_version" || echo 200)
          [ "$code" = "404" ] && crate=true || crate=false

          {
            echo "npm=$npm";     echo "npm_version=$npm_version"
            echo "pypi=$pypi";   echo "pypi_version=$pypi_version"
            echo "crate=$crate"; echo "crate_version=$crate_version"
          } >> "$GITHUB_OUTPUT"

          {
            echo "| Package | Manifest version | Action |"
            echo "|---|---|---|"
            echo "| npm | \`$npm_version\` | $([ "$npm" = true ] && echo 'publish' || echo 'already published') |"
            echo "| PyPI | \`$pypi_version\` | $([ "$pypi" = true ] && echo 'publish' || echo 'already published') |"
            echo "| crates.io | \`$crate_version\` | $([ "$crate" = true ] && echo 'publish' || echo 'already published') |"
          } >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: Publish to npm
    needs: [gate, plan]
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release tag
      id-token: write # required for npm provenance
    defaults:
      run:
        working-directory: clients/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # A tag, deliberately not a GitHub Release: Zenodo mints a DOI from each Release,
      # and the DOI belongs to the specification, not to a client package bump.
      - name: Tag the published commit
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.npm_version }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/npm-v$VERSION" -f sha="${{ github.sha }}"

  pypi:
    name: Publish to PyPI
    needs: [gate, plan]
    if: needs.plan.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # to create the release tag
      id-token: write # required for trusted publishing + PEP 740 attestations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: clients/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
      # A tag, deliberately not a GitHub Release: see the note in the npm job.
      - name: Tag the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.pypi_version }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/py-v$VERSION" -f sha="${{ github.sha }}"

  crate:
    name: Publish to crates.io
    needs: [gate, plan]
    if: needs.plan.outputs.crate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release tag
      id-token: write # required for the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        working-directory: clients/rust
        run: cargo package
      # crates.io has no native provenance channel, so attest the packaged .crate here;
      # anyone can check it with `gh attestation verify --owner ionalpha`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: clients/rust/target/package/provetrail-*.crate
      - name: Publish
        working-directory: clients/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # A tag, deliberately not a GitHub Release: see the note in the npm job.
      - name: Tag the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.crate_version }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/crate-v$VERSION" -f sha="${{ github.sha }}"
